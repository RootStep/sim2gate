# Publishes to PyPI with trusted publishing (no stored token).
# One-time setup on pypi.org: add a pending publisher for project "sim2gate",
# owner "RootStep", repository "sim2gate", workflow "publish.yml", environment "pypi".
name: Publish to PyPI

# Release by pushing a version tag (git tag v0.0.2 && git push origin v0.0.2),
# or by running this workflow by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
