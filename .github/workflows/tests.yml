name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rsl-rl: ["5.0.1", "5.5.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]" "rsl-rl-lib==${{ matrix.rsl-rl }}"
      # tests/test_signals.py is skipped here: it needs ppo-shaping-diagnostics, which is not on PyPI yet
      - run: python -m pytest -q tests
