# (1) We use this file to configure the nginx reverse proxy required for each course.
worker_processes auto;
pid /etc/nginx/.nginx.pid;


events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 0;
	keepalive_timeout 65;
	types_hash_max_size 2048;

	default_type application/octet-stream;

	# RootStep: no TLS listener here. Brev's Secure Link terminates TLS; the upstream self-signed 443 server
	# (TLSv1/1.1 allowed) and the /lab route (password in a URL query string, logged by access_log) are removed.

	access_log /var/log/access.log;
	error_log /var/log/error.log;

	gzip on;
	gzip_disable "msie6";

    
	server {
		listen 80 default_server;
		listen [::]:80 default_server;

		# Global proxy settings
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_redirect off;
		

		# Redirect /viewer to /viewer/ for proper routing
		location = /viewer {
			return 301 /viewer/;
		}

		location /viewer/ {
			include /etc/nginx/viewer_auth.conf;
			proxy_pass http://localhost:5173/viewer/;
		}

		# Kit's WebRTC signaling server. Note it only binds 49100 once the streaming
		# stack has actually initialized - on a host whose driver cannot render, Kit
		# starts and binds 8011 but never opens 49100. An absent 49100 therefore means
		# "no renderer", not "wrong port"; check the Kit log for vkCreateInstance
		# failures before changing this. Verify with: ss -tulpn | grep kit
		location /sign_in {
			include /etc/nginx/viewer_auth.conf;
			proxy_pass http://localhost:49100/sign_in;
		}

		location / {
			proxy_pass http://localhost:8080/;
		}
	}

}
