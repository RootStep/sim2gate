# Build contexts live here so that a deployment using prebuilt images can simply
# omit this file (docker compose merges it automatically when present).
#
# RootStep change: no `network: host` on the builds. Newer Docker Compose builds through
# Buildx bake, which refuses host networking without an extra entitlement
# ("pass --allow=network.host"); the default build network is enough here.
services:
  vscode:
    build:
      context: ./vscode
      args:
        ARENA_IMAGE: ${ARENA_IMAGE:-isaaclab_arena:latest}
        SIM2GATE_REF: ${SIM2GATE_REF:-main}

  nginx:
    build:
      context: ./nginx

  web-viewer:
    build:
      context: ./web-viewer-sample
