[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sim2gate"
version = "0.0.1"
description = "Training-aware diagnostics for sim-trained robot policies (pre-alpha placeholder)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["robotics", "reinforcement-learning", "sim-to-real", "isaac-lab", "diagnostics"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/RootStep/sim2gate"
Issues = "https://github.com/RootStep/sim2gate/issues"

[project.scripts]
sim2gate = "sim2gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sim2gate"]
